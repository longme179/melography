[package]
name = "melography-lut"
description = "LUT engine: .cube parse/validate (token-stream, strict), tetrahedral CPU interpolation, encoding contracts, intensity/mix + insertion points, content-addressed library (M1, issues #7 #9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
melography-core = { workspace = true }
melography-color = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Guaranteed-unique, panic-safe temp dirs (auto-cleanup on drop). The
# hand-rolled nanos-clock naming it replaces collided on macOS: the clock
# has microsecond granularity, two parallel tests drew the same name,
# shared one dir, and one test's remove_dir_all raced the other's rename
# into ENOENT (PR #22 macOS run 40086829632).
tempfile = "3"
