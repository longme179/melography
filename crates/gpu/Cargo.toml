[package]
name = "melography-gpu"
description = "wgpu/WGSL render context + CPU↔GPU parity harness — M0: adapter probe & readback bench behind the `wgpu` feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
melography-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
wgpu = { version = "30", optional = true, default-features = false, features = [
    "wgsl",
    "vulkan",
    "gles",
    "metal",
    "dx12",
] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[features]
default = []
# Compile the real wgpu backend (used by spikes/s1-transport and, later, the
# parity harness). Off by default so the processing workspace stays light.
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
melography-film = { workspace = true }
melography-presets = { workspace = true }
naga = "30" 
serde_json = { workspace = true }
melography-lut = { workspace = true }
# Self dev-dependency: turns the `wgpu` feature on for this crate's OWN
# tests without forcing it on downstream users (M0 pattern keeps default
# builds light; CI builds wgpu anyway via spikes/s1-transport).
melography-gpu = { path = ".", features = ["wgpu"] }
