[package]
name = "melography-cli"
description = "Headless MELOGRAPHY: synthetic charts, S1→S5 roundtrip, golden hashes, benchmarks, codec matrix (first-class CI citizen, ARCHITECTURE §1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "melography"
path = "src/main.rs"

[dependencies]
melography-core = { workspace = true }
melography-color = { workspace = true }
melography-io = { workspace = true }
melography-film = { workspace = true }
melography-presets = { workspace = true }
melography-lut = { workspace = true }
melography-ai = { workspace = true }
sha2 = { workspace = true }
bytemuck = "1"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Unique panic-safe temp dirs (see the lut crate note; same macOS µs-clock
# collision class fixed repo-wide).
tempfile = "3"
