[package]
name = "melography-color"
description = "Color management: AP1 working space, fast-path matrices, lcms2 transforms (vendored-static for cross-OS determinism), CIEDE2000 oracle (M0)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
melography-core = { workspace = true }
# `static` forces the vendored Little-CMS 2.19 source to be compiled by cc on
# every OS — same library version everywhere → cross-OS golden determinism
# (Spike S2, docs/research/spikes/S2_REPORT.md). No system lcms2 is used.
lcms2 = { workspace = true }
thiserror = { workspace = true }
bytemuck = "1"
sha2 = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
melography-io = { workspace = true }
