# MELOGRAPHY CI — honest Phase-0 gates.
#
# Design rules (docs/RELEASING.md §6, skills/cross-platform-ci):
#   * Every job runs real commands whose exit codes mean something.
#   * Phase-conditional jobs use explicit `if:` conditions — Rust gates stay
#     skipped (and are REPORTED as skipped) until Cargo.toml exists (M0).
#   * No publish, no release, no push triggers beyond PR/push-to-branch.
#   * Actions pinned by commit SHA (verified 2026-10-24, see RELEASING §6).
#   * Least privilege: workflow-level read-all; nothing writes.
#   * No third-party actions beyond the two official ones pinned below; the
#     Rust jobs use the runner's preinstalled rustup (respects
#     rust-toolchain.toml when the workspace exists).

name: ci

on:
  pull_request:
  push:
    branches: ["agent/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust gate: hashFiles() is only valid in STEP-level if; compute the
  #    condition here and pass it to the Rust jobs via needs-context outputs
  #    (needs outputs ARE valid in job-level if). This avoids the workflow
  #    startup-validation failure observed in run #1 — see session log
  #    2026-10-24-01 "CI first run" for the diagnosis trail. ────────────────
  rust-gate:
    name: Rust workspace gate (activates Rust jobs at M0)
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.check.outputs.has_rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          if [ -n "${{ hashFiles('Cargo.toml') }}" ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
            echo "Phase 0: no Cargo workspace yet — Rust gates intentionally not run (this is not a pass claim)."
          fi

  # ── Phase-0 gate: repository/docs validation (always real) ────────────────
  docs-validation:
    name: Docs & repo validation (phase 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install YAML validator
        run: pip install --disable-pip-version-check pyyaml
      - name: Validate docs inventory, parsers, links, secrets
        run: python3 scripts/validate_docs.py
      - name: Shell syntax
        run: |
          bash -n scripts/fetch_refs.sh \
            scripts/build/build-linux.sh scripts/build/build-macos.sh
      - name: Python compile
        run: |
          python3 -m py_compile scripts/fetch_refs.py scripts/validate_docs.py \
            scripts/secret_scan.py scripts/provenance_check.py \
            scripts/error_inventory.py scripts/gen_fuzz_corpus.py
      - name: Secret scan (#25 — full pattern set + .gitignore policy executable)
        run: python3 scripts/secret_scan.py
      - name: Provenance gate (#25 — every binary asset has a sha-verified record)
        run: python3 scripts/provenance_check.py
      - name: Error-state inventory (#25 — Rust codes × EN/VI catalogs × matrix rows)
        run: python3 scripts/error_inventory.py
      - name: LUT oracle fixture freshness (issue #7)
        run: python3 tools/lut_oracle.py --verify crates/lut/tests/oracle_fixtures.json
      - name: Architecture guard (ARCHITECTURE §2 — core stays UI-agnostic)
        run: |
          # The processing core (crates/*) must never depend on the shell —
          # the precise form of the old global cargo-deny ban on tauri/wry
          # (which could not be scoped per-graph and broke the app's own
          # supply-chain gate).
          if grep -rnE 'tauri|wry' crates/*/Cargo.toml; then
            echo "::error::processing crates must not depend on the UI shell (ARCHITECTURE §2)"
            exit 1
          fi
          echo "OK: no shell dependencies in crates/*"

  # ── Cross-OS tooling smoke (real commands on all 3 desktop OSes; catches
  #    platform breakage of the tooling itself before Rust exists) ───────────
  tooling-matrix:
    name: Tooling smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install YAML validator
        run: pip install --disable-pip-version-check pyyaml
      - name: Validate docs (full parse + links + secrets)
        run: python scripts/validate_docs.py
      - name: fetch_refs dry list (no network)
        run: python scripts/fetch_refs.py --list

  # ── Rust gates: ACTIVATE ONLY WHEN THE WORKSPACE EXISTS (M0) ──────────────
  # These jobs intentionally report "skipped" until Cargo.toml lands. This is
  # the honest state: no Rust code exists in Phase 0, so no Rust test may
  # claim to pass. The `if:` condition turns them on automatically at M0.
  rust-fmt-clippy:
    name: Rust fmt + clippy (activates at M0)
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust tests ${{ matrix.os }} (activates at M0)
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Tests
        run: cargo test --workspace -- --nocapture
      # M2: heavy film-statistical gates (grain RMS/PSD/zoom) run in
      # release — megapixel synthetic renders (docs/quality/M2 report §1).
      - name: Film statistical gates (release)
        run: cargo test --release -p melography-film --test gates -- --ignored --nocapture
      # GPU reality per OS (measured since the first activated run, 1668e76):
      # macos exposes a Metal adapter ('Apple Paravirtual device'), windows
      # exposes WARP ('Microsoft Basic Render Driver') — both run the REAL
      # wgpu gates (S1 readback + M1 lut3d CPU↔GPU parity ≤ 1e-6); ubuntu
      # runners have no adapter and the tests report an honest skip.

  # ── M4 #25: memory budget gate — ≤ 2 GiB peak RSS for a 50 MP
  #    decode → render → export (PLAN §4). Release-mode #[ignore]d test
  #    like the film gates; prints the hardware used. Linux reports the
  #    exact VmHWM, Windows PeakWorkingSetSize, macOS a sampled lower
  #    bound (no portable VmHWM — printed as such, never claimed exact). ──
  memory-budget:
    name: Memory budget 50MP (${{ matrix.os }})
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Budget test (release, 49.8 MP full film chain + tone → PNG16)
        run: cargo test --release -p melography-cli --test memory_budget -- --ignored --nocapture

  # ── M4 #25: fuzz battery — short time-boxed bursts per target
  #    (ARCHITECTURE §9). Ubuntu only (sanitizer availability); a crash
  #    fails the job and the artifact is uploaded for triage. Seeds are
  #    copied to a scratch corpus so the committed tree stays pristine. ──
  fuzz-burst:
    name: Fuzz bursts (4 targets x 30s)
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly (cargo-fuzz sanitizer runtime)
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz 0.13.0 (pinned, --locked)
        run: cargo install --locked --version 0.13.0 cargo-fuzz
      - name: Burst decode_image
        run: |
          cp -r fuzz/corpus/decode_image /tmp/corpus-decode
          cargo +nightly fuzz run decode_image /tmp/corpus-decode --release -- \
            -max_total_time=30 -rss_limit_mb=2560 -timeout=15
      - name: Burst cube_parser
        run: |
          cp -r fuzz/corpus/cube_parser /tmp/corpus-cube
          cargo +nightly fuzz run cube_parser /tmp/corpus-cube --release -- \
            -max_total_time=30 -rss_limit_mb=2560 -timeout=15
      - name: Burst sidecar_json
        run: |
          cp -r fuzz/corpus/sidecar_json /tmp/corpus-sidecar
          cargo +nightly fuzz run sidecar_json /tmp/corpus-sidecar --release -- \
            -max_total_time=30 -rss_limit_mb=2560 -timeout=15
      - name: Burst manifest_json
        run: |
          cp -r fuzz/corpus/manifest_json /tmp/corpus-manifest
          cargo +nightly fuzz run manifest_json /tmp/corpus-manifest --release -- \
            -max_total_time=30 -rss_limit_mb=2560 -timeout=15
      - name: Upload crash artifacts (triage only, 14-day retention)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          retention-days: 14

  # ── Supply-chain gate (activates at M0 — promised by deny.toml's header) ──
  cargo-deny:
    name: cargo-deny (activates at M0)
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Install cargo-deny 0.20.2 (pinned, --locked)
        run: cargo install --locked --version 0.20.2 cargo-deny
      - name: Licenses + advisories + bans + sources
        run: cargo deny check

  # ── M3: ONNX parameter-predictor evaluation (feature `onnx`; issue #14).
  #    The vetting bar: baseline vs dummy benchmark + latency budget —
  #    every candidate model must beat the baseline HERE before shipping.
  #    ort binaries download at build time (same pin as the S3 spike).
  ai-onnx:
    name: AI onnx eval (activates at M3)
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Clippy (onnx features)
        run: cargo clippy -p melography-ai --all-targets --features onnx -- -D warnings
      - name: Tests + baseline-vs-dummy benchmark (the bar)
        run: cargo test -p melography-ai --features onnx -- --nocapture
      - name: Latency budget (release, ADR-0004 §5)
        run: cargo test --release -p melography-ai --features onnx --test onnx_eval -- --ignored --nocapture

  # ── M1: editor shell (apps/melography-app — excluded workspace member;
  #    needs the webkit system stack at build time like the S4 spike, plus
  #    node for the Svelte UI build). Frontend is built AND type-checked;
  #    the Rust side runs fmt+clippy+tests with default (gui) features. ──
  app-build:
    name: Editor shell build (ubuntu)
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Install tauri linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Node toolchain (runner-preinstalled)
        run: node --version && npm --version
      - name: UI install + typecheck + build (Svelte/vite)
        run: |
          npm --prefix apps/melography-app/ui ci
          npm --prefix apps/melography-app/ui run check
          npm --prefix apps/melography-app/ui run build
      - name: UI i18n audit (#15 — parity, VI diacritics, embedded strings, error-code coverage)
        run: node scripts/ui_i18n_audit.mjs
      - name: UI WCAG contrast audit (#15 — AA computed from app.css tokens, all 3 themes)
        run: node scripts/ui_contrast_audit.mjs
      - name: UI pseudo-locale build (#15 — UX_SPEC §10; catalogs accented + 40% padded)
        run: npm --prefix apps/melography-app/ui run build:pseudo
      - name: App fmt + clippy (gui features)
        run: |
          cargo fmt --manifest-path apps/melography-app/Cargo.toml -- --check
          cargo clippy --manifest-path apps/melography-app/Cargo.toml --all-targets -- -D warnings
      - name: App tests (render/error/pipeline units — no GUI needed)
        run: cargo test --manifest-path apps/melography-app/Cargo.toml
      - name: Install cargo-deny 0.20.2 (pinned, --locked)
        run: cargo install --locked --version 0.20.2 cargo-deny
      - name: App supply chain (cargo-deny on the app's own lockfile)
        run: cd apps/melography-app && cargo deny --config ../../deny.toml check

  # ── Spike S4: updater dummy-channel roundtrip (standalone crate, no gate) ──
  # tauri on Linux needs the webkit system stack at BUILD time even with the
  # mock runtime (muda/gtk + tauri-runtime link webkit2gtk).
  spike-s4-updater:
    name: Spike S4 updater roundtrip (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain
        run: rustup show active-toolchain
      - name: Install tauri linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Updater roundtrip tests (mock runtime, dummy channel)
        run: cargo test --manifest-path spikes/s4-updater/Cargo.toml
      - name: Live /releases/latest semantics probe (S4, ADR-0005 §1)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -L \
            https://github.com/longme179/melography/releases/latest)
          echo "GET /releases/latest -> HTTP $code"
          echo "(404 expected while zero releases exist; the prerelease-"
          echo " exclusion semantics are re-verified at M5 with a real"
          echo " release — see docs/research/spikes/S4_REPORT.md)"
          case "$code" in
            200|404) exit 0 ;;
            *) echo "unexpected status: $code"; exit 1 ;;
          esac

  # ── HEIF/AVIF go-no-go probe (standalone crate; R-IN-2, PLAN M0 item 8) ──
  spike-heif-probe:
    name: HEIF/AVIF probe (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain
        run: rustup show active-toolchain
      - name: Install system libheif + decode-only plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libheif-dev libheif-plugin-libde265 libheif-plugin-dav1d
      - name: HEIC/AVIF decode evidence
        run: cargo test --manifest-path spikes/heif-probe/Cargo.toml
