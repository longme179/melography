# MELOGRAPHY CI — honest Phase-0 gates.
#
# Design rules (docs/RELEASING.md §6, skills/cross-platform-ci):
#   * Every job runs real commands whose exit codes mean something.
#   * Phase-conditional jobs use explicit `if:` conditions — Rust gates stay
#     skipped (and are REPORTED as skipped) until Cargo.toml exists (M0).
#   * No publish, no release, no push triggers beyond PR/push-to-branch.
#   * Actions pinned by commit SHA (verified 2026-10-24, see RELEASING §6).
#   * Least privilege: workflow-level read-all; nothing writes.
#   * No third-party actions beyond the two official ones pinned below; the
#     Rust jobs use the runner's preinstalled rustup (respects
#     rust-toolchain.toml when the workspace exists).

name: ci

on:
  pull_request:
  push:
    branches: ["agent/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust gate: hashFiles() is only valid in STEP-level if; compute the
  #    condition here and pass it to the Rust jobs via needs-context outputs
  #    (needs outputs ARE valid in job-level if). This avoids the workflow
  #    startup-validation failure observed in run #1 — see session log
  #    2026-10-24-01 "CI first run" for the diagnosis trail. ────────────────
  rust-gate:
    name: Rust workspace gate (activates Rust jobs at M0)
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.check.outputs.has_rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          if [ -n "${{ hashFiles('Cargo.toml') }}" ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
            echo "Phase 0: no Cargo workspace yet — Rust gates intentionally not run (this is not a pass claim)."
          fi

  # ── Phase-0 gate: repository/docs validation (always real) ────────────────
  docs-validation:
    name: Docs & repo validation (phase 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install YAML validator
        run: pip install --disable-pip-version-check pyyaml
      - name: Validate docs inventory, parsers, links, secrets
        run: python3 scripts/validate_docs.py
      - name: Shell syntax
        run: bash -n scripts/fetch_refs.sh
      - name: Python compile
        run: python3 -m py_compile scripts/fetch_refs.py scripts/validate_docs.py

  # ── Cross-OS tooling smoke (real commands on all 3 desktop OSes; catches
  #    platform breakage of the tooling itself before Rust exists) ───────────
  tooling-matrix:
    name: Tooling smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install YAML validator
        run: pip install --disable-pip-version-check pyyaml
      - name: Validate docs (full parse + links + secrets)
        run: python scripts/validate_docs.py
      - name: fetch_refs dry list (no network)
        run: python scripts/fetch_refs.py --list

  # ── Rust gates: ACTIVATE ONLY WHEN THE WORKSPACE EXISTS (M0) ──────────────
  # These jobs intentionally report "skipped" until Cargo.toml lands. This is
  # the honest state: no Rust code exists in Phase 0, so no Rust test may
  # claim to pass. The `if:` condition turns them on automatically at M0.
  rust-fmt-clippy:
    name: Rust fmt + clippy (activates at M0)
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust tests ${{ matrix.os }} (activates at M0)
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Tests
        run: cargo test --workspace -- --nocapture
      # GPU reality per OS (measured since the first activated run, 1668e76):
      # macos exposes a Metal adapter ('Apple Paravirtual device'), windows
      # exposes WARP ('Microsoft Basic Render Driver') — both run the REAL
      # wgpu gates (S1 readback + M1 lut3d CPU↔GPU parity ≤ 1e-6); ubuntu
      # runners have no adapter and the tests report an honest skip.

  # ── Supply-chain gate (activates at M0 — promised by deny.toml's header) ──
  cargo-deny:
    name: cargo-deny (activates at M0)
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Install cargo-deny 0.20.2 (pinned, --locked)
        run: cargo install --locked --version 0.20.2 cargo-deny
      - name: Licenses + advisories + bans + sources
        run: cargo deny check

  # ── M1: editor shell (apps/melography-app — excluded workspace member;
  #    needs the webkit system stack at build time like the S4 spike, plus
  #    node for the Svelte UI build). Frontend is built AND type-checked;
  #    the Rust side runs fmt+clippy+tests with default (gui) features. ──
  app-build:
    name: Editor shell build (ubuntu)
    needs: rust-gate
    if: needs.rust-gate.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Install tauri linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Node toolchain (runner-preinstalled)
        run: node --version && npm --version
      - name: UI install + typecheck + build (Svelte/vite)
        run: |
          npm --prefix apps/melography-app/ui ci
          npm --prefix apps/melography-app/ui run check
          npm --prefix apps/melography-app/ui run build
      - name: App fmt + clippy (gui features)
        run: |
          cargo fmt --manifest-path apps/melography-app/Cargo.toml -- --check
          cargo clippy --manifest-path apps/melography-app/Cargo.toml --all-targets -- -D warnings
      - name: App tests (render/error/pipeline units — no GUI needed)
        run: cargo test --manifest-path apps/melography-app/Cargo.toml
      - name: Install cargo-deny 0.20.2 (pinned, --locked)
        run: cargo install --locked --version 0.20.2 cargo-deny
      - name: App supply chain (cargo-deny on the app's own lockfile)
        run: cargo deny --config deny.toml check --manifest-path apps/melography-app/Cargo.toml

  # ── Spike S4: updater dummy-channel roundtrip (standalone crate, no gate) ──
  # tauri on Linux needs the webkit system stack at BUILD time even with the
  # mock runtime (muda/gtk + tauri-runtime link webkit2gtk).
  spike-s4-updater:
    name: Spike S4 updater roundtrip (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain
        run: rustup show active-toolchain
      - name: Install tauri linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Updater roundtrip tests (mock runtime, dummy channel)
        run: cargo test --manifest-path spikes/s4-updater/Cargo.toml
      - name: Live /releases/latest semantics probe (S4, ADR-0005 §1)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -L \
            https://github.com/longme179/melography/releases/latest)
          echo "GET /releases/latest -> HTTP $code"
          echo "(404 expected while zero releases exist; the prerelease-"
          echo " exclusion semantics are re-verified at M5 with a real"
          echo " release — see docs/research/spikes/S4_REPORT.md)"
          case "$code" in
            200|404) exit 0 ;;
            *) echo "unexpected status: $code"; exit 1 ;;
          esac

  # ── HEIF/AVIF go-no-go probe (standalone crate; R-IN-2, PLAN M0 item 8) ──
  spike-heif-probe:
    name: HEIF/AVIF probe (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate pinned toolchain
        run: rustup show active-toolchain
      - name: Install system libheif + decode-only plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libheif-dev libheif-plugin-libde265 libheif-plugin-dav1d
      - name: HEIC/AVIF decode evidence
        run: cargo test --manifest-path spikes/heif-probe/Cargo.toml
