# cargo-deny configuration — supply-chain gate (ADR-0003, AGENTS.md §6).
# Run: cargo deny check  (licenses + advisories + bans + sources)
# CI: .github/workflows/ci.yml `cargo-deny` job (activates at M0).

[graph]
# Analyze the whole workspace including dev-deps and targets
all-features = false

# ── Licenses ────────────────────────────────────────────────────────────────
# MELOGRAPHY is GPL-3.0-or-later (ADR-0003). Dependencies must be GPL-compatible:
# permissive (MIT/Apache/BSD/ISC/Zlib), or weak-copyleft only where explicitly
# reviewed. GPL/AGPL *dependencies* are denied: linking them creates obligations
# we have not reviewed, and we do not need them (verified in Phase-0 REFERENCES).
[licenses]
version = 2
allow = [
    "GPL-3.0-or-later", # this project
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0", # webpki-root-certs (ureq build-dep of ort-sys); permissive data license, GPL-compatible
    "MPL-2.0", # servo stack via tauri's dom_query (cssparser, selectors, dtoa-short, option-ext, cssparser-macros). MPL-2.0 is explicitly GPL-compatible (MPL 2.0 §1.12 secondary-license mechanism); file-level weak copyleft, reviewed 2026-10-24 (M1 app-build).
]
confidence-threshold = 0.93
exceptions = []
# Vendored Little-CMS inside lcms2-sys is MIT (crate COPYING file) — recorded
# for THIRD_PARTY_NOTICES.md via scripts/gen_third_party_notices.py (S2 spike
# evidence: docs/research/spikes/S2_REPORT.md).

# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
# Internal path/workspace deps carry no version requirement by design
# (single workspace, single version policy) — the wildcard check would
# false-positive on every `workspace = true` dep, so it is disabled here
# and internal hygiene is enforced by clippy + review instead.
wildcards = "allow"
highlight = "all"
# NOTE (M1): the previous global `deny` on tauri/wry enforced ARCHITECTURE
# §2 ("processing core stays UI-agnostic") — but cargo-deny bans cannot be
# scoped per-crate-graph, and the *app* crate legitimately depends on the
# shell. The rule now lives where it actually applies: a CI guard that
# forbids tauri/wry/tauri-plugin in crates/*/Cargo.toml (docs-validation
# job, 'architecture guard' step). The app's own deny run covers its tree.
deny = []

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
version = 2
yanked = "warn"
ignore = [
    # proc-macro-error is unmaintained (RUSTSEC-2024-0370); it is a transitive
    # dep of the gtk3-macros stack (via tauri on Linux), build-time only, no
    # known vulnerabilities. Tracked for replacement upstream; harmless here.
    { id = "RUSTSEC-2024-0370", reason = "build-time transitive via gtk3-macros; no known vulns; upstream tracked" },
]

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
